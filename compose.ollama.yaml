# Ollama, shared by the dev and prod stacks: one copy of the model in
# memory. Their taggers reach it on the internal `ollama` network.
name: extended-mind-ollama

services:
  # Local LLM server. Idle until asked; loads the model into memory on a
  # request and unloads it after 5 minutes without one.
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    # Every check is two logged requests: often while starting, then rarely.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      start_period: 60s
      start_interval: 5s
      interval: 5m
      retries: 10
    # egress: to pull models.
    networks: [ollama, egress]

  # One-off: downloads the tagging model if missing, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.2:3b"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [ollama, egress]

networks:
  ollama:
    name: ollama
    internal: true
  egress: {}
