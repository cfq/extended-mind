[project]
name = "extended-mind"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "courlan>=1.3",
    "django>=6.0",
    "django-environ>=0.12",
    "django-ninja>=1.6",
    "httpx2>=2.16",
    # Same minor version as the browser container (docker/browser.Dockerfile).
    "playwright>=1.65,<1.66",
    "procrastinate>=3.0",
    "psycopg[binary,pool]>=3.2",
    "trafilatura>=2.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
