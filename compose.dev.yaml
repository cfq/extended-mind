# Dev: source mounted, runserver with reload, env from .env.dev.
# Ports on 127.0.0.1 only; dev-em.cfqs.com reaches the app through nginx.

# Containers run as root; keep root-owned caches out of the bind mount.
x-dev: &dev
  env_file: .env.dev
  volumes:
    - .:/app
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTEST_ADDOPTS: "-p no:cacheprovider"
    RUFF_NO_CACHE: "true"

services:
  app:
    <<: *dev
    build:
      args:
        DEV: "true"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *dev

  tagger:
    <<: *dev

  migrate:
    <<: *dev

  db:
    env_file: .env.dev

  # Vite dev server; proxies /api, /admin, /static to app.
  # Runs as the host user so node_modules and lock files aren't root-owned.
  # Not started by make up (profile); make vite. Reach it over SSH:
  # ssh -L 5173:localhost:5173.
  frontend:
    profiles: [vite]
    image: node:24-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /frontend
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./frontend:/frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on: [app]
    networks: [web]
