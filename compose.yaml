name: extended-mind

x-app: &app
  image: extended-mind
  env_file: .env
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
    networks: [web, backend]

  # Uses the image built by app.
  worker:
    <<: *app
    pull_policy: never
    command: ["python", "manage.py", "procrastinate", "worker"]
    networks: [backend, egress]

  db:
    image: postgres:18
    env_file: .env
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [backend]

networks:
  web: {}
  backend:
    internal: true
  egress: {}
