name: extended-mind

# Shared by dev and prod. Each overlay sets the env file, and prod its own
# image, data paths and ports (compose.dev.yaml, compose.prod.yaml).
# Ollama runs separately, shared by both (compose.ollama.yaml).

x-app: &app
  image: extended-mind
  restart: unless-stopped
  volumes:
    - ./data/dev/item_sources:/data/item_sources
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    networks: [web, backend]

  # Uses the image built by app.
  worker:
    <<: *app
    pull_policy: never
    command: ["python", "manage.py", "procrastinate", "worker", "--queues", "default"]
    networks: [backend, egress, browser]

  # Model tagging jobs, one at a time; they can take a minute on CPU.
  tagger:
    <<: *app
    pull_policy: never
    command: ["python", "manage.py", "procrastinate", "worker", "--queues", "tags"]
    networks: [backend, ollama]

  # Headless Chromium for fetching pages and screenshots; the worker
  # connects over a websocket. Its own networks: it can reach the web and
  # the worker, nothing else.
  browser:
    build:
      context: docker
      dockerfile: browser.Dockerfile
    image: extended-mind-browser
    init: true
    restart: unless-stopped
    shm_size: 1gb
    networks: [browser, browser-egress]

  # One-off: applies migrations, then exits.
  migrate:
    image: extended-mind
    pull_policy: never
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - ./data/dev/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [backend]

networks:
  web: {}
  backend:
    internal: true
  egress: {}
  browser:
    internal: true
  browser-egress: {}
  # Created by compose.ollama.yaml (make ollama).
  ollama:
    external: true
